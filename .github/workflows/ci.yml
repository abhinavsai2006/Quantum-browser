name: Qualium Quantum Browser v1 - Multi-Platform Continuous Security Pipeline

on:
  push:
    branches: [ main, release-* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "1756166400"
  ZERO_AR_DATE: "1"

jobs:
  # ==========================================================
  # 1. LINUX x64 BUILD & PACKAGING RUNNER
  # ==========================================================
  linux-build-and-test:
    name: Linux x64 Build, Tests & Distribution Package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain & Dependencies
        run: |
          rustup update stable
          sudo apt-get update && sudo apt-get install -y clang lld llvm libssl-dev pkg-config dpkg-dev

      - name: Run Full Workspace Tests (42 Security Tests)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Build Release Binaries & Package Linux Bundle
        run: |
          cargo build --release --workspace
          python3 scripts/package-cross-platform.py

      - name: Upload Linux Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualium-linux-x86_64
          path: dist/Qualium-Quantum-Browser-v1.0.0-linux-x86_64.tar.gz

  # ==========================================================
  # 2. MACOS RUNNER (APPLE SILICON & INTEL)
  # ==========================================================
  macos-build-and-test:
    name: macOS Build, Tests & .app Bundle Package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup update stable

      - name: Run Full Workspace Tests (42 Security Tests)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Build macOS Release Binaries & Package .app Bundle
        run: |
          cargo build --release --workspace
          python3 scripts/package-cross-platform.py

      - name: Upload macOS Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualium-macos-universal
          path: dist/Qualium-Quantum-Browser-v1.0.0-macOS-Universal.tar.gz

  # ==========================================================
  # 3. WINDOWS x64 RUNNER
  # ==========================================================
  windows-build-and-test:
    name: Windows x64 Release & Setup Packaging
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup update stable

      - name: Run Full Workspace Tests (42 Security Tests)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Build Windows Installer & Release Artifacts
        run: |
          cargo build --release --workspace
          python scripts/package-cross-platform.py

      - name: Upload Windows Setup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualium-windows-x64
          path: |
            dist/Qualium-Quantum-Browser-v1.0.0-Setup.exe
            dist/SHA256SUMS.asc
            dist/sbom-v1.0.0.spdx.json
