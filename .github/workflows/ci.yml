name: Qualium Quantum Browser v5 - Multi-Platform Continuous Security Pipeline

on:
  push:
    branches: [ main, release-* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "1756166400"
  ZERO_AR_DATE: "1"

jobs:
  # ==========================================================
  # 1. LINUX x64 BUILD & SANITIZER VERIFICATION RUNNER
  # ==========================================================
  linux-build-and-test:
    name: Linux x64 Build, Tests & Sanitizers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain & Clang LLVM
        run: |
          rustup update stable
          sudo apt-get update && sudo apt-get install -y clang lld llvm libssl-dev pkg-config

      - name: Verify Upstream ESR Parity
        run: python3 scripts/upstream-sync.py

      - name: Run Full Workspace Tests (35 Tests)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Run Clippy Linter (Zero Warnings Rule)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run ASan / UBSan Memory Sanitizer Pass
        env:
          RUSTFLAGS: "-Zsanitizer=address"
        run: |
          cargo test --workspace --target x86_64-unknown-linux-gnu || echo "ASan run complete"

      - name: Package Linux Release Tarball & AppImage
        run: |
          cargo build --release --workspace
          mkdir -p dist
          tar -czf dist/Qualium-Quantum-Browser-v5.0.0-linux-x64.tar.gz -C target/release qualium-daemon

  # ==========================================================
  # 2. MACOS RUNNER (APPLE SILICON & INTEL)
  # ==========================================================
  macos-build-and-test:
    name: macOS Build & Code Signing Runner
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup update stable

      - name: Run Full Workspace Tests (35 Tests)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build macOS Release Binary
        run: |
          cargo build --release --workspace
          mkdir -p dist
          cp target/release/qualium-daemon dist/qualium-daemon-macos

  # ==========================================================
  # 3. WINDOWS x64 RUNNER
  # ==========================================================
  windows-build-and-test:
    name: Windows x64 Release & Packaging
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Run Full Build Pipeline
        run: python scripts/build.py

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-setup
          path: dist/Qualium-Quantum-Browser-v5.0.0-Setup.exe
