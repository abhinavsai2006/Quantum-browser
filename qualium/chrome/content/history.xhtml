<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Qualium History</title>
  <link rel="stylesheet" href="chrome://qualium/content/styles/tokens.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/icons.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/components.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/history.css"/>
  <script>
    //<![CDATA[
    // If opened in a standalone dialog/modal window, immediately redirect to a tab in the main window
    if (window.opener && window.opener.openTrustedLinkIn) {
      try {
        window.opener.openTrustedLinkIn("qualium://history", "tab");
        window.close();
      } catch (e) {}
    }
    //]]>
  </script>
  <style>
    .history-search-bar {
      margin: 1.5rem 0;
      display: flex;
      gap: 1rem;
    }
    .history-search-input {
      flex: 1;
      max-width: 400px;
      padding: 0.6rem 1rem;
      background: var(--q-bg-input);
      border: 1px solid var(--q-border-subtle);
      border-radius: var(--q-radius-md);
      color: var(--q-text-primary);
      font-size: var(--q-text-sm);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--q-bg-surface);
      border: 1px solid var(--q-border-subtle);
      border-radius: var(--q-radius-lg);
      text-decoration: none;
      color: var(--q-text-primary);
      transition: background var(--q-motion-fast), border-color var(--q-motion-fast);
    }
    .history-item:hover {
      background: var(--q-bg-elevated);
      border-color: var(--q-border-medium);
    }
    .history-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .history-time {
      font-size: var(--q-text-xs);
      color: var(--q-text-muted);
      font-family: var(--q-font-mono);
      min-width: 70px;
    }
    .history-title {
      font-size: var(--q-text-sm);
      font-weight: 500;
    }
    .history-url {
      font-size: var(--q-text-xs);
      color: var(--q-text-secondary);
      font-family: var(--q-font-mono);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <div class="header-title-row">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h1>Browsing &amp; Search History</h1>
      </div>
      <p class="header-desc">Search through your private session activity. All entries are encrypted and automatically cleared on session end.</p>
    </header>

    <div class="history-search-bar">
      <input type="text" id="history-search" class="history-search-input" placeholder="Search history..."/>
      <button type="button" class="q-btn q-btn-secondary" id="btn-clear-history">Clear Session History</button>
    </div>

    <div class="history-list" id="history-list">
      <!-- Populated dynamically -->
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h3>No history entries found</h3>
      <p>Pages and searches you visit during this session will be listed here.</p>
    </div>
  </div>

  <script>
    function renderHistory(filter) {
      const listEl = document.getElementById("history-list");
      const emptyEl = document.getElementById("empty-state");
      if (!listEl) return;

      let history = [];
      try {
        history = JSON.parse(localStorage.getItem("qualium_history") || "[]");
      } catch(e) {}

      if (filter) {
        history = history.filter(item => 
          item.title.toLowerCase().includes(filter.toLowerCase()) || 
          item.url.toLowerCase().includes(filter.toLowerCase())
        );
      }

      listEl.innerHTML = "";
      if (history.length === 0) {
        if (emptyEl) emptyEl.style.display = "flex";
        return;
      }

      if (emptyEl) emptyEl.style.display = "none";
      history.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";
        row.innerHTML = `
          <div class="history-meta">
            <span class="history-time">${item.time || "Recent"}</span>
            <div>
              <div class="history-title">${item.title}</div>
              <div class="history-url">${item.url}</div>
            </div>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderHistory("");

      const searchInput = document.getElementById("history-search");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          renderHistory(e.target.value.trim());
        });
      }

      const clearBtn = document.getElementById("btn-clear-history");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          localStorage.removeItem("qualium_history");
          renderHistory("");
        });
      }
    });
  </script>
</body>
</html>
