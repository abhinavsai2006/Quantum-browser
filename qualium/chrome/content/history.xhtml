<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Qaulium History</title>
  <link rel="stylesheet" href="chrome://qualium/content/styles/tokens.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/icons.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/components.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/history.css"/>
  <script src="chrome://qualium/content/qualium-routes.js"></script>
  <script src="chrome://qualium/content/favicon-service.js"></script>
  <script>
    //<![CDATA[
    // If opened in a standalone dialog/modal window, immediately redirect to a tab in the main window
    if (window.opener && window.opener.openTrustedLinkIn) {
      try {
        window.opener.openTrustedLinkIn("qualium://history", "tab");
        window.close();
      } catch (e) {}
    }
    //]]>
  </script>
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <div class="header-title-row">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h1>Browsing &amp; Search History</h1>
      </div>
      <p class="header-desc">Search through your private session activity. All entries are encrypted and stored locally in your enclave.</p>
    </header>

    <div class="history-search-bar">
      <div class="history-search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="history-search" class="history-search-input" placeholder="Search history by title or URL..."/>
      </div>
      <div class="history-actions">
        <button type="button" class="q-btn q-btn-secondary" id="btn-clear-history">Clear History</button>
      </div>
    </div>

    <div class="history-list" id="history-list">
      <!-- Populated dynamically from QauliumHistoryStore -->
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h3>No history entries found</h3>
      <p>Pages and searches you visit during this session will be recorded here automatically.</p>
    </div>
  </div>

  <script>
    //<![CDATA[
    function formatTime(timestamp) {
      if (!timestamp) return "Recent";
      const d = new Date(timestamp);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const timeStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (isToday) return timeStr;
      const dateStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      return `${dateStr}, ${timeStr}`;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function renderHistory(filter = "") {
      const listEl = document.getElementById("history-list");
      const emptyEl = document.getElementById("empty-state");
      if (!listEl) return;

      let history = [];
      if (typeof QualiumHistoryStore !== "undefined") {
        history = await QualiumHistoryStore.searchHistory(filter);
      } else {
        try {
          history = JSON.parse(localStorage.getItem("qualium_history_v5") || "[]");
          if (filter) {
            const q = filter.toLowerCase();
            history = history.filter(item => 
              (item.title && item.title.toLowerCase().includes(q)) || 
              (item.url && item.url.toLowerCase().includes(q))
            );
          }
        } catch(e) {}
      }

      listEl.innerHTML = "";
      if (!history || history.length === 0) {
        if (emptyEl) emptyEl.style.display = "flex";
        return;
      }

      if (emptyEl) emptyEl.style.display = "none";

      for (const item of history) {
        const row = document.createElement("div");
        row.className = "history-item";
        row.setAttribute("data-url", item.url);

        let iconMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>`;

        if (typeof QualiumFaviconService !== "undefined") {
          try {
            const favInfo = await QualiumFaviconService.getForPage(item.url);
            if (favInfo) {
              if (favInfo.isInternal && favInfo.svg) {
                iconMarkup = favInfo.svg;
              } else if (favInfo.dataUrl) {
                iconMarkup = `<img src="${favInfo.dataUrl}" alt="" loading="lazy"/>`;
              } else if (favInfo.svg) {
                iconMarkup = favInfo.svg;
              }
            }
          } catch(e) {}
        } else if (item.iconDataUrl) {
          iconMarkup = `<img src="${item.iconDataUrl}" alt="" loading="lazy"/>`;
        }

        const visits = item.visitCount || 1;
        const visitBadge = visits > 1 ? `<span class="history-badge">${visits} visits</span>` : "";

        row.innerHTML = `
          <div class="history-item-left">
            <div class="history-favicon-box">${iconMarkup}</div>
            <div class="history-info">
              <div class="history-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title || item.url)}</div>
              <div class="history-url" title="${escapeHtml(item.url)}">${escapeHtml(item.url)}</div>
            </div>
          </div>
          <div class="history-item-right">
            ${visitBadge}
            <span class="history-time">${formatTime(item.lastVisitedAt || item.time)}</span>
            <button type="button" class="history-delete-btn" title="Remove from history" aria-label="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        `;

        // Click navigates inside Qualium browser tab — never external!
        row.addEventListener("click", (e) => {
          if (e.target.closest(".history-delete-btn")) {
            e.stopPropagation();
            if (typeof QualiumHistoryStore !== "undefined") {
              QualiumHistoryStore.deleteEntry(item.id);
            }
            row.remove();
            if (listEl.children.length === 0 && emptyEl) {
              emptyEl.style.display = "flex";
            }
            return;
          }

          const target = (e.ctrlKey || e.metaKey || e.button === 1) ? "tab" : "current";
          if (window.opener && window.opener.openTrustedLinkIn) {
            window.opener.openTrustedLinkIn(item.url, target);
          } else if (window.parent && window.parent.qualiumNav) {
            window.parent.qualiumNav.navigate(item.url);
          } else if (typeof QualiumNavigationController !== "undefined" && window.QualiumNavigationController.navigateTo) {
            QualiumNavigationController.navigateTo(item.url, target);
          } else {
            window.location.href = item.url;
          }
        });

        // Middle click support
        row.addEventListener("auxclick", (e) => {
          if (e.button === 1) {
            e.preventDefault();
            if (window.opener && window.opener.openTrustedLinkIn) {
              window.opener.openTrustedLinkIn(item.url, "tab");
            } else if (window.parent && window.parent.qualiumNav) {
              window.parent.qualiumNav.navigate(item.url);
            } else if (typeof QualiumNavigationController !== "undefined" && window.QualiumNavigationController.navigateTo) {
              QualiumNavigationController.navigateTo(item.url, "tab");
            }
          }
        });

        listEl.appendChild(row);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderHistory("");

      const searchInput = document.getElementById("history-search");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          renderHistory(e.target.value.trim());
        });
      }

      const clearBtn = document.getElementById("btn-clear-history");
      if (clearBtn) {
        clearBtn.addEventListener("click", async () => {
          if (typeof QualiumHistoryStore !== "undefined") {
            await QualiumHistoryStore.clearHistory();
          } else {
            localStorage.removeItem("qualium_history_v5");
          }
          renderHistory("");
        });
      }

      // Auto-refresh when new history events arrive
      if (typeof QualiumHistoryStore !== "undefined") {
        QualiumHistoryStore.subscribe(() => {
          const filter = searchInput ? searchInput.value.trim() : "";
          renderHistory(filter);
        });
      }
    });
    //]]>
  </script>
</body>
</html>
