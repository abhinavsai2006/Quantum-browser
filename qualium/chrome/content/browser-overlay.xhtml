<?xml version="1.0" encoding="UTF-8"?>
<!-- Qaulium Quantum Browser v1 - Native Toolbar Chrome Overlay -->
<overlay id="qualium-browser-overlay"
         xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
         xmlns:html="http://www.w3.org/1999/xhtml">

  <toolbarpalette id="BrowserToolbarPalette">
    <!-- 🛡 Q Security Toolbar Button -->
    <toolbarbutton id="qualium-security-button"
                   class="toolbarbutton-1 chromeclass-toolbar-additional"
                   label="Qaulium Security Hub"
                   tooltiptext="Qualium Quantum Security &amp; Privacy (🛡 Q)"
                   type="menu-button"
                   oncommand="QualiumPanel.toggle(this, event)">
      <image class="toolbarbutton-icon" src="chrome://qualium/skin/qualium-shield.svg"/>
      <label class="toolbarbutton-text" value="🛡 Q"/>
      <panel id="qualium-security-panel"
             type="arrow"
             orient="vertical"
             noautofocus="true"
             role="dialog"
             aria-label="Qaulium Security Hub">
        <!-- Panel content loaded from qualium-panel.xhtml -->
      </panel>
    </toolbarbutton>
  </toolbarpalette>

</overlay>
