<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Qualium Downloads</title>
  <link rel="stylesheet" href="chrome://qualium/content/styles/tokens.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/icons.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/components.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/downloads.css"/>
  <script>
    //<![CDATA[
    // If opened in a standalone dialog/modal window, immediately redirect to a tab in the main window
    if (window.opener && window.opener.openTrustedLinkIn) {
      try {
        window.opener.openTrustedLinkIn("qualium://downloads", "tab");
        window.close();
      } catch (e) {}
    }
    //]]>
  </script>
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <div class="header-title-row">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <h1>Downloads</h1>
      </div>
      <p class="header-desc">Downloaded files are verified with SHA-256 hash checks and protected from automatic execution.</p>
    </header>

    <div class="empty-state">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <h3>No downloads yet</h3>
      <p>Files you download during this private session will appear here.</p>
    </div>
  </div>
</body>
</html>
