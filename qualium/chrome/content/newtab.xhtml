<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Tab</title>
  <link rel="stylesheet" href="chrome://qualium/content/newtab.css"/>
  <script src="chrome://qualium/content/qualium-routes.js"></script>
  <script src="chrome://qualium/content/favicon-service.js"></script>
  <script src="chrome://qualium/content/runtime-state.js"></script>
  <script src="chrome://qualium/content/newtab.js" defer="defer"></script>
</head>
<body>

<div class="newtab-page">

  <!-- Top action buttons -->
  <header class="top-nav">
    <div class="nav-spacer"></div>
    <div class="nav-actions">
      <a href="chrome://qualium/content/history.xhtml" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://history'); return false;} else if(window.opener &amp;&amp; window.opener.openTrustedLinkIn){ window.opener.openTrustedLinkIn('qualium://history', 'tab'); return false; }" class="nav-icon-link" title="History">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </a>
      <a href="chrome://qualium/content/extensions.xhtml" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://extensions'); return false;} else if(window.opener &amp;&amp; window.opener.openTrustedLinkIn){ window.opener.openTrustedLinkIn('qualium://extensions', 'tab'); return false; }" class="nav-icon-link" title="Extensions">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
      </a>
      <a href="chrome://qualium/content/dashboard.xhtml" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://security'); return false;} else if(window.opener &amp;&amp; window.opener.openTrustedLinkIn){ window.opener.openTrustedLinkIn('qualium://security', 'tab'); return false; }" class="nav-icon-link" title="Security Center">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="2" fill="#34d399"/>
        </svg>
      </a>
      <a href="chrome://qualium/content/settings.xhtml" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://settings'); return false;} else if(window.opener &amp;&amp; window.opener.openTrustedLinkIn){ window.opener.openTrustedLinkIn('qualium://settings', 'tab'); return false; }" class="nav-icon-link" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      <a href="chrome://qualium/content/about.xhtml" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://about'); return false;} else if(window.opener &amp;&amp; window.opener.openTrustedLinkIn){ window.opener.openTrustedLinkIn('qualium://about', 'tab'); return false; }" class="nav-icon-link" title="About Qaulium">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Central Search & Shortcuts Area -->
  <main class="content-container">

    <!-- Brand Header -->
    <div class="brand-section">
      <div class="logo-wrap">
        <img class="brand-logo" src="chrome://qualium/content/qaulium_logo_128.png" alt="Qaulium" width="76" height="76"/>
      </div>
      <h1 class="brand-title">Qaulium</h1>
      <span class="brand-badge">Quantum Browser</span>
    </div>

    <!-- Search Form -->
    <form class="search-form" id="search-form" autocomplete="off">
      <div class="search-box">
        <div class="search-icon-wrap">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input type="text" id="search-input" class="search-input" placeholder="Search with Google or enter address" autocomplete="off" spellcheck="false"/>
        <button type="submit" class="search-submit-btn" title="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Top Sites / Shortcuts Grid -->
    <section class="shortcuts-section">
      <div id="shortcuts-grid" class="shortcuts-grid">
        <!-- Dynamically populated by newtab.js -->
      </div>
    </section>

  </main>

  <!-- Bottom Privacy Status Pill (Live Circuit Banner) -->
  <footer class="bottom-footer">
    <a href="qualium://security" onclick="if(window.QualiumNavigationController){window.QualiumNavigationController.navigateTo('qualium://security'); return false;}" class="security-status-pill" id="security-status-pill" title="View Security Center">
      <span class="status-dot" id="pill-status-dot"></span>
      <span class="status-label" id="pill-status-label">● PQC NEGOTIATING</span>
      <span class="status-sep" id="pill-status-sep">·</span>
      <span class="status-tech" id="pill-status-hops">Building Circuit...</span>
    </a>
  </footer>

</div>



</body>
</html>
