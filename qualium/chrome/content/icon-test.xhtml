<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Icon System Test — Qaulium</title>
  <link rel="stylesheet" href="chrome://qualium/content/styles/tokens.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/icons.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/components.css"/>
  <style>
    body {
      background: var(--q-bg-canvas);
      color: var(--q-text-primary);
      font-family: var(--q-font-sans);
      padding: 2rem;
      margin: 0;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .icon-card {
      background: var(--q-bg-surface);
      border: 1px solid var(--q-border-subtle);
      border-radius: var(--q-radius-lg);
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }
    .icon-card .q-icon {
      width: 24px;
      height: 24px;
      color: var(--q-text-primary);
    }
    .icon-card:hover .q-icon {
      color: var(--q-accent-primary);
    }
    .icon-name {
      font-size: var(--q-text-xs);
      color: var(--q-text-secondary);
      font-family: var(--q-font-mono);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <h1>Qaulium Embedded Icon System Test</h1>
    <p>Visual self-test verifying all bundled vector icons render with 100% fidelity.</p>

    <div class="icon-grid">
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg><span class="icon-name">back</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><span class="icon-name">forward</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg><span class="icon-name">reload</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="icon-name">stop</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="icon-name">home</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="icon-name">search</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="icon-name">shield</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span class="icon-name">lock</span></div>

      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="icon-name">download</span></div>

      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg><span class="icon-name">menu</span></div>
      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="icon-name">plus</span></div>

      <div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="icon-name">info</span></div>
    </div>
  </div>
</body>
</html>
