<?xml version="1.0"?>
<?xml-stylesheet href="chrome://qualium/content/styles/tokens.css" type="text/css"?>
<?xml-stylesheet href="chrome://qualium/content/styles/icons.css" type="text/css"?>
<?xml-stylesheet href="chrome://qualium/content/styles/components.css" type="text/css"?>
<?xml-stylesheet href="chrome://qualium/content/browser.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="qualium-main-window"
        windowtype="navigator:browser"
        title="Qaulium Quantum Browser"
        width="1280" height="800"
        persist="screenX screenY width height sizemode">

  <html:div class="browser-window" style="display: flex; flex-direction: column; width: 100%; height: 100%; background: #111215;">
    <!-- 1. Qaulium Tab Strip (Chromium / Firefox 2024 Modern Rounded Tabs) -->
    <html:div class="browser-titlebar" id="titlebar" style="display: flex; align-items: center; background: #121316; padding: 4px 8px 0 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); min-height: 40px;">
      <html:div class="tab-strip" id="tab-strip" style="display: flex; align-items: flex-end; gap: 4px; flex: 1;">
        <html:div class="tab active" id="tab-1" style="display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: #28292e; border: 1px solid rgba(255, 255, 255, 0.08); border-bottom: none; border-radius: 8px 8px 0 0; color: #ffffff; font-size: 12.5px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);">
          <html:span class="tab-title" id="tab-1-title">New Tab</html:span>
        </html:div>
        <html:button type="button" id="btn-add-tab" style="background: transparent; border: none; border-radius: 50%; color: #bcc1ca; width: 28px; height: 28px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 3px;">+</html:button>
      </html:div>
      <html:div style="color: #64748b; font-size: 11px; letter-spacing: 0.06em; font-weight: 600; padding-right: 12px; text-transform: uppercase;">QAULIUM QUANTUM</html:div>
    </html:div>

    <!-- 2. Qaulium Navigation Toolbar (Chromium-style Minimalist Circular Controls) -->
    <html:div class="browser-toolbar" id="toolbar" style="display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: #1c1d22; border-bottom: 1px solid rgba(255, 255, 255, 0.06);">
      <html:button class="toolbar-btn" id="btn-back" style="background: transparent; border: none; border-radius: 50%; color: #bcc1ca; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;">&#8592;</html:button>
      <html:button class="toolbar-btn" id="btn-forward" style="background: transparent; border: none; border-radius: 50%; color: #bcc1ca; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;">&#8594;</html:button>
      <html:button class="toolbar-btn" id="btn-reload" style="background: transparent; border: none; border-radius: 50%; color: #bcc1ca; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;">&#8635;</html:button>
      
      <!-- Modern Chromium Pill Omnibox -->
      <html:div style="flex: 1; display: flex; align-items: center; background: #121316; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 0 12px; height: 34px; max-width: 820px; margin: 0 auto; box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);">
        <html:div style="display: flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 2px 8px; margin-right: 8px;">
          <html:span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399;"></html:span>
          <html:span style="color: #d1d5db; font-size: 11px; font-weight: 500;">Protected</html:span>
        </html:div>
        <html:input type="text" id="url-input" style="flex: 1; background: transparent; border: none; outline: none; color: #f1f3f4; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;" placeholder="Search privately or enter URL..."/>
      </html:div>

      <!-- Qaulium Privacy Shield Button (Refined Pill) -->
      <html:button id="btn-q-privacy" style="display: flex; align-items: center; gap: 6px; background: #28292e; border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;">
        <html:span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399;"></html:span>
        <html:span>Q Privacy</html:span>
      </html:button>
    </html:div>

    <!-- 3. Native Gecko Content Engine Viewport -->
    <browser id="content-browser" type="content" primary="true" remote="true" flex="1" src="chrome://qualium/content/newtab.xhtml" style="flex: 1; width: 100%; height: 100%; border: none;"/>
  </html:div>

  <script src="qualium_shell.js"/>
</window>
