<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Bookmarks — Qaulium</title>
  <link rel="stylesheet" href="chrome://qualium/content/styles/tokens.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/icons.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/styles/components.css"/>
  <link rel="stylesheet" href="chrome://qualium/content/bookmarks.css"/>
  <script>
    //<![CDATA[
    // If opened in a standalone dialog/modal window, immediately redirect to a tab in the main window
    if (window.opener && window.opener.openTrustedLinkIn) {
      try {
        window.opener.openTrustedLinkIn("chrome://qualium/content/bookmarks.xhtml", "tab");
        window.close();
      } catch (e) {}
    }
    //]]>
  </script>
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <div class="header-title-row">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <h1>Bookmarks</h1>
      </div>
      <p class="header-desc">Locally stored private bookmarks, never synced to external cloud servers.</p>
    </header>

    <div class="empty-state">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="q-icon q-icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <h3>No bookmarks yet</h3>
      <p>Click the star icon in the address bar or press <kbd>Ctrl+D</kbd> to save websites privately.</p>
    </div>
  </div>
</body>
</html>
